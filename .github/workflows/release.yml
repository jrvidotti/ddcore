name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  binaries:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build Desk UI
        run: |
          cd desk
          npm ci --silent
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Package Cross-Platform Binaries
        run: |
          mkdir -p dist
          TAG="${{ steps.release_info.outputs.tag }}"
          
          build_target() {
            OS=$1
            ARCH=$2
            OUTPUT="ddcore"
            TAR_NAME="ddcore-${OS}-${ARCH}.tar.gz"
            echo "==> Building for ${OS}/${ARCH} with version ${TAG}..."
            
            mkdir -p "dist/build_${OS}_${ARCH}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build \
              -ldflags="-s -w -X github.com/jrvidotti/ddcore/internal/engine.Version=${TAG}" \
              -o "dist/build_${OS}_${ARCH}/${OUTPUT}" ./cmd/ddcore
            
            cp LICENSE THIRD_PARTY_NOTICES.md "dist/build_${OS}_${ARCH}/"
            tar -czf "dist/${TAR_NAME}" -C "dist/build_${OS}_${ARCH}" "${OUTPUT}" LICENSE THIRD_PARTY_NOTICES.md
            rm -rf "dist/build_${OS}_${ARCH}"
          }

          build_target linux amd64
          build_target linux arm64
          build_target darwin amd64
          build_target darwin arm64

          cd dist
          sha256sum ddcore-*.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.tag }}
          files: |
            dist/ddcore-*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
