name: Release

on:
  push:
    branches:
      - main
    # main rebuilds edge only when something the binary carries changed;
    # tag pushes ignore path filters and always release. Later patterns
    # win, so the embedded docs are put back after the docs are excluded.
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - '!.github/workflows/deploy-docs.yml'
      - 'CHANGELOG.md'
      - 'docs/embed.go'
      - 'docs/agent/*.md'
      - 'docs/changelog/0.*.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build Desk UI
        run: |
          cd desk
          npm ci --silent
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # main's rolling build is a prerelease named edge, so that
            # releases/latest — what install.sh and `ddcore doctor` read —
            # is always the newest tagged version
            echo "tag=edge" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and Package Cross-Platform Binaries
        run: |
          mkdir -p dist
          TAG="${{ steps.release_info.outputs.tag }}"
          
          build_target() {
            OS=$1
            ARCH=$2
            OUTPUT="ddcore"
            TAR_NAME="ddcore-${OS}-${ARCH}.tar.gz"
            echo "==> Building for ${OS}/${ARCH} with version ${TAG}..."
            
            mkdir -p "dist/build_${OS}_${ARCH}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build \
              -ldflags="-s -w -X github.com/jrvidotti/ddcore/internal/engine.Version=${TAG}" \
              -o "dist/build_${OS}_${ARCH}/${OUTPUT}" ./cmd/ddcore
            
            if [ "$OS" = linux ]; then
              mkdir -p "dist/image/linux-${ARCH}"
              cp "dist/build_${OS}_${ARCH}/${OUTPUT}" "dist/image/linux-${ARCH}/"
            fi
            cp LICENSE THIRD_PARTY_NOTICES.md "dist/build_${OS}_${ARCH}/"
            tar -czf "dist/${TAR_NAME}" -C "dist/build_${OS}_${ARCH}" "${OUTPUT}" LICENSE THIRD_PARTY_NOTICES.md
            rm -rf "dist/build_${OS}_${ARCH}"
          }

          build_target linux amd64
          build_target linux arm64
          build_target darwin amd64
          build_target darwin arm64

          cd dist
          sha256sum ddcore-*.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.tag }}
          files: |
            dist/ddcore-*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The image a site's Dockerfile starts FROM, for tagged releases only:
      # ghcr.io/jrvidotti/ddcore:<X.Y.Z>, :<X.Y> and :latest.
      - name: Image tags
        id: image
        if: steps.release_info.outputs.prerelease == 'false'
        run: |
          V="${{ steps.release_info.outputs.tag }}"
          V="${V#v}"
          MINOR="${V%.*}"
          IMG="ghcr.io/${{ github.repository_owner }}/ddcore"
          echo "tags=${IMG}:${V},${IMG}:${MINOR},${IMG}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.image.outputs.tags != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.image.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.image.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: dist/image
          file: docker/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release_info.outputs.tag }}
            org.opencontainers.image.licenses=MIT
