services:
  postgres:
    image: postgres:17-alpine
    container_name: ddcore-pg
    restart: unless-stopped
    ports:
      - "5455:5432"
    environment:
      POSTGRES_USER: ddcore
      POSTGRES_PASSWORD: ddcore
      POSTGRES_DB: ddcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddcore -d ddcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Go tests' cluster (internal/testdb): every test creates and drops a database, and on the
  # dev cluster each DROP DATABASE waited for a checkpoint that fsyncs hundreds of new files.
  # This one lives in memory and keeps no durability, so nothing in it survives a restart —
  # nothing in it needs to.
  postgres-test:
    image: postgres:17-alpine
    container_name: ddcore-pg-test
    restart: unless-stopped
    ports:
      - "5456:5432"
    environment:
      POSTGRES_USER: ddcore
      POSTGRES_PASSWORD: ddcore
      POSTGRES_DB: ddcore_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    tmpfs:
      - /var/lib/postgresql/data:size=4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddcore -d ddcore_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage for trying DDCORE_STORAGE=s3 locally. Opt-in:
  #   docker compose --profile s3 up -d
  # Console at http://localhost:9001 (ddcore / ddcore-secret); see docs/agent/storage.md.
  minio:
    image: quay.io/minio/minio:latest
    container_name: ddcore-minio
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ddcore
      MINIO_ROOT_PASSWORD: ddcore-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ddcore ddcore-secret &&
      mc mb --ignore-existing local/ddcore"
    restart: "no"

volumes:
  postgres_data:
    name: ddcore_postgres_data
  minio_data:
    name: ddcore_minio_data
